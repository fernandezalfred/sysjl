<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Sin conexión · SysJL</title>
    <style>
      :root {
        --background: #ffffff;
        --foreground: #171717;
        --muted: #525252;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0a0a0a;
          --foreground: #ededed;
          --muted: #a3a3a3;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--background);
        color: var(--foreground);
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }
      button {
        margin-top: 20px;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: var(--foreground);
        color: var(--background);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="SysJL" />
      <h1>Sin conexión</h1>
      <p>Revisa tu internet e inténtalo de nuevo. Lo que ya guardaste está a salvo.</p>
      <p lang="en">You're offline. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
